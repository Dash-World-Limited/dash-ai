AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DASH AI STAGING (eu-west-1) 3/4 edge: ACM certificate (DNS validation, owner-published record),
  internet-facing Application Load Balancer (HTTPS only, HTTP redirects), API target group on /ready.
  Creates no DNS record for the API hostname. Not production.

Rules:
  StagingRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", eu-west-1]
        AssertDescription: DASH AI staging is defined for eu-west-1 (Ireland) only.
  ExpectedAccountOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::AccountId", !Ref ExpectedAccountId]
        AssertDescription: ExpectedAccountId must be the account this stack is being deployed into.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [staging]
    Default: staging
  ExpectedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
  StagingApiHostname:
    Type: String
    # Must name staging explicitly, so a production hostname can never be given to this stack.
    AllowedPattern: "^([a-z0-9-]+\\.)*[a-z0-9-]*staging[a-z0-9-]*(\\.[a-z0-9-]+)+$"
    ConstraintDescription: A lower-case hostname containing the word "staging", e.g. api.staging.example.com
    Description: >-
      The owner-chosen staging API hostname. ACM issues its certificate only after the owner publishes
      the validation CNAME (stack creation waits for it). The API CNAME to the ALB is also owner-made.
  CertificateValidationHostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^(Z[A-Z0-9]{1,31})?$"
    Description: >-
      Optional. Only if the hostname's zone is in Route 53 in this account AND the owner approved ACM
      writing the validation record there. Empty (default) = the owner publishes the record by hand.

Conditions:
  ValidateInRoute53: !Not [!Equals [!Ref CertificateValidationHostedZoneId, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref StagingApiHostname
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - ValidateInRoute53
        - - DomainName: !Ref StagingApiHostname
            HostedZoneId: !Ref CertificateValidationHostedZoneId
        - !Ref "AWS::NoValue"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "dash-ai-${EnvironmentName}"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split [",", !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-PublicSubnetIds" }]
      SecurityGroups:
        - !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-AlbSecurityGroupId" }
      LoadBalancerAttributes:
        # Above PROVIDER_TIMEOUT_MS (120 s) so a long streamed answer is not cut by the proxy.
        - { Key: idle_timeout.timeout_seconds, Value: "180" }
        # TRUST_PROXY=1 is correct only while the ALB APPENDS the peer address it saw and is the only
        # proxy: the API then believes exactly the rightmost X-Forwarded-For entry (the ALB's).
        - { Key: routing.http.xff_header_processing.mode, Value: append }
        - { Key: routing.http.xff_client_port.enabled, Value: "false" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: defensive }
        # Staging must be removable in one step (docs/aws-staging.md, "Shutting staging down").
        - { Key: deletion_protection.enabled, Value: "false" }
        # Access logs need an S3 bucket and add cost; ALB metrics cover staging health.
        - { Key: access_logs.s3.enabled, Value: "false" }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "dash-ai-${EnvironmentName}-api"
      VpcId: !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-VpcId" }
      TargetType: ip
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port: 8787
      # /ready: 200 when the database answers; 503 while draining or without the database.
      # A Redis outage reports "degraded" with 200 on purpose (taking every task out would not help).
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 3
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Below the task's 30 s stopTimeout and above the API's 20 s SHUTDOWN_DRAIN_MS.
        - { Key: deregistration_delay.timeout_seconds, Value: "25" }
        - { Key: load_balancing.algorithm.type, Value: round_robin }
        - { Key: stickiness.enabled, Value: "false" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup
      ListenerAttributes:
        # The API does not send HSTS itself; the HTTPS entry point adds it.
        - { Key: routing.http.response.strict_transport_security.header_value, Value: max-age=31536000 }
        - { Key: routing.http.response.server.enabled, Value: "false" }

  # /metrics never leaves the VPC: it answers 404 at the ALB like any unknown path, and operators
  # read it from inside a task (docs/aws-staging.md, "Diagnostics").
  MetricsNotFoundRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: [/metrics, /metrics/*]
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: application/json
            MessageBody: '{"error":{"code":"not_found","message":"Not found.","retryable":false}}'

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "dash-ai-${EnvironmentName}-alb-unhealthy-targets"
      AlarmDescription: At least one API task failed /ready for 2 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-AlarmTopicArn" }

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "dash-ai-${EnvironmentName}-api-5xx"
      AlarmDescription: More than 5 API 5xx responses in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-AlarmTopicArn" }

  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "dash-ai-${EnvironmentName}-alb-5xx"
      AlarmDescription: The load balancer itself answered 5xx (no healthy task, or a proxy failure).
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-AlarmTopicArn" }

  # Cost guard: the second task is for the multi-instance session only (Phase 10 -> Phase 11).
  SecondTaskLeftRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "dash-ai-${EnvironmentName}-second-task-left-running"
      AlarmDescription: Two or more healthy API tasks for 3 hours - return the service to 1 task.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue { "Fn::Sub": "dash-ai-${EnvironmentName}-AlarmTopicArn" }

Outputs:
  LoadBalancerDnsName:
    Description: The owner points the staging hostname here (CNAME) - a manual, owner-approved DNS step.
    Value: !GetAtt LoadBalancer.DNSName
  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroup
    Export: { Name: !Sub "dash-ai-${EnvironmentName}-ApiTargetGroupArn" }
  StagingApiHostname:
    Value: !Ref StagingApiHostname
