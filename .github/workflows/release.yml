# Release build: MANUAL ONLY (Actions → Release build → Run workflow). Never runs on push.
# Produces an UNSIGNED, minified release APK and checks it for provider keys/endpoints. Signing and
# store upload are intentionally absent: they need signing secrets in a protected environment.
name: Release build

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to build a release APK'
        required: true
      server_url:
        description: "Optional default API address baked into the build (https://…/), e.g. your staging API. Empty: users enter it in Settings."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-apk:
    name: Unsigned release APK
    if: ${{ inputs.confirm == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: "Gate: Kotlin core tests (live API contract tests run in CI)"
        working-directory: apps/android/core
        run: ../gradlew test --no-daemon
      - name: "Gate: app unit/UI tests"
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build the release APK (unsigned)
        working-directory: apps/android
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace "-PdashServerUrl=$SERVER_URL"
          else
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi
      - name: Check the APK contains no provider keys or endpoints
        run: scripts/check-apk.sh "$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
      - name: Record the APK checksum
        run: |
          apk="$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          { echo "### Release APK (unsigned)"; echo '```'; sha256sum "$apk"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dash-ai-release-unsigned-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
