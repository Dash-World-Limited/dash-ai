# Fast verification on every push and pull request. Each job is isolated so a failure points at
# one layer. The Android app module runs in android.yml (path-filtered); release builds only in
# release.yml (manual).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tracked-file secret scan
        run: node scripts/scan-secrets.mjs
      - name: Gitleaks (history and working tree)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (pinned release)
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -sSfL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  backend:
    name: Backend (lint, typecheck, unit + API tests on the in-memory store, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contract and API tests (PostgreSQL tests are skipped here and run in the next job)
        run: pnpm test
      - run: pnpm build
      - name: The live smoke command stays a no-op unless explicitly enabled
        run: pnpm smoke:live

  postgres:
    name: PostgreSQL + Redis integration (store contract, encryption, shared rate limits, whole API suite, migrations from zero)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway Redis for the shared rate-limit tests. No password: it only exists for this job.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Throwaway database for this job only. Trust auth: no password exists anywhere.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/dash_test
      # A missing database must fail the job, not silently skip the PostgreSQL tests.
      REQUIRE_DB_TESTS: "1"
      TEST_REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Whole API suite on PostgreSQL and Redis (store contract, encryption, restart and shared rate-limit tests)
        run: pnpm --filter @dash-ai/api test:pg
      - name: Migrations from zero, twice, then encryption maintenance, through the built CLIs
        run: |
          psql "postgres://postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE dash_fresh"
          export DATABASE_URL=postgres://postgres@127.0.0.1:5432/dash_fresh
          DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DATA_ENCRYPTION_KEY
          node apps/api/dist/migrate-cli.js
          node apps/api/dist/migrate-cli.js
          node apps/api/dist/data-cli.js

  kotlin-core:
    name: Kotlin core (pure Kotlin) + live contract tests against the API on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dash_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start the API (fake providers, PostgreSQL store, key generated for this run only)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          export DATABASE_URL=postgres://postgres@127.0.0.1:5432/dash_live
          DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DATA_ENCRYPTION_KEY
          # Every live contract test signs up a fresh account from one IP, so the CI-only server
          # allows more sign-ins per minute than the production default (10).
          PROVIDER_MODE=fake PORT=8787 FAKE_STREAM_DELAY_MS=2 LOG_LEVEL=warn RATE_LIMIT_AUTH_PER_MINUTE=60 node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/health
      - name: Core unit, contract and live contract tests
        working-directory: apps/android/core
        env:
          DASH_API_BASE_URL: http://127.0.0.1:8787
        run: ../gradlew test --no-daemon
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: apps/android/core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: API log
        if: failure()
        run: cat /tmp/api.log || true
