# Fast verification on every push and pull request. Each job is isolated so a failure points at
# one layer. The Android app module runs in android.yml (path-filtered); release builds only in
# release.yml (manual).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tracked-file secret scan
        run: node scripts/scan-secrets.mjs
      - name: Gitleaks (history and working tree)
        env:
          GITLEAKS_VERSION: 8.21.2
          # From the release's gitleaks_8.21.2_checksums.txt; change both together.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned release)
        env:
          ACTIONLINT_VERSION: 1.7.7
          # From the release's actionlint_1.7.7_checksums.txt; change both together.
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sSfL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  backend:
    name: Backend and web (lint, typecheck, unit + API tests on the in-memory store, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contract and API tests (PostgreSQL tests are skipped here and run in the next job)
        run: pnpm test
      - run: pnpm build
      - name: The live smoke command stays a no-op unless explicitly enabled
        run: pnpm smoke:live

  postgres:
    name: PostgreSQL + Redis integration (store contract, encryption, shared rate limits, whole API suite, migrations from zero)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway Redis for the shared rate-limit tests. No password: it only exists for this job.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Throwaway database for this job only. Trust auth: no password exists anywhere.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/dash_test
      # A missing database must fail the job, not silently skip the PostgreSQL tests.
      REQUIRE_DB_TESTS: "1"
      TEST_REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Whole API suite on PostgreSQL and Redis (store contract, encryption, restart and shared rate-limit tests)
        run: pnpm --filter @dash-ai/api test:pg
      - name: Migrations from zero, twice, then encryption maintenance, through the built CLIs
        run: |
          psql "postgres://postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE dash_fresh"
          export DATABASE_URL=postgres://postgres@127.0.0.1:5432/dash_fresh
          DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DATA_ENCRYPTION_KEY
          node apps/api/dist/migrate-cli.js
          node apps/api/dist/migrate-cli.js
          node apps/api/dist/data-cli.js

  kotlin-core:
    name: Kotlin core (pure Kotlin) + live contract tests against the API on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dash_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Start the API (fake providers, PostgreSQL store, key generated for this run only)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          export DATABASE_URL=postgres://postgres@127.0.0.1:5432/dash_live
          DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DATA_ENCRYPTION_KEY
          # Every live contract test signs up a fresh account from one IP, so the CI-only server
          # allows more sign-ins per minute than the production default (10).
          PROVIDER_MODE=fake PORT=8787 FAKE_STREAM_DELAY_MS=2 LOG_LEVEL=warn RATE_LIMIT_AUTH_PER_MINUTE=60 node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/health
      - name: Core unit, contract and live contract tests
        working-directory: apps/android/core
        env:
          DASH_API_BASE_URL: http://127.0.0.1:8787
        run: ../gradlew test --no-daemon
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-test-reports
          path: apps/android/core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: API log
        if: failure()
        run: cat /tmp/api.log || true

  web-e2e:
    name: Web app in Chromium and Firefox against the real API (fake providers, PostgreSQL) + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dash_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium and Firefox for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox
      - name: Start the API (fake providers) and the built web app
        run: |
          export DATABASE_URL=postgres://postgres@127.0.0.1:5432/dash_web
          DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export DATA_ENCRYPTION_KEY
          node apps/api/dist/migrate-cli.js
          PROVIDER_MODE=fake PORT=8787 FAKE_STREAM_DELAY_MS=5 LOG_LEVEL=warn RATE_LIMIT_AUTH_PER_MINUTE=100 node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          (cd apps/web && npx vite preview --host 127.0.0.1 --port 4173 > /tmp/web.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/health
      - name: End-to-end tests (Chromium and Firefox, phone and desktop sizes)
        working-directory: apps/web
        env:
          DASH_SHOTS_DIR: ${{ github.workspace }}/apps/web/test-results/screenshots
          DASH_E2E_FIREFOX: "1"
        run: |
          mkdir -p "$DASH_SHOTS_DIR"
          npx playwright test
      - name: Upload screenshots and the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: API log
        if: failure()
        run: cat /tmp/api.log /tmp/web.log || true

  container:
    name: API container image (build from the lockfile, then local smoke test; never pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Build and local verification only: no registry login, no push, no cloud credentials, no deploy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image for linux/amd64, the Fargate X86_64 target (no build arguments, no secrets)
        run: docker build --platform=linux/amd64 -t dash-ai-api:ci .
      - name: The image is linux/amd64
        run: test "$(docker image inspect dash-ai-api:ci --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
      - name: Local container smoke test (throwaway PostgreSQL and Redis with TLS, fake providers only)
        run: deploy/container/smoke.sh dash-ai-api:ci
      - name: Image summary
        run: |
          docker image inspect dash-ai-api:ci --format 'user={{.Config.User}} cmd={{json .Config.Cmd}} entrypoint={{json .Config.Entrypoint}} ports={{json .Config.ExposedPorts}} platform={{.Os}}/{{.Architecture}} size={{.Size}}'
          docker history --no-trunc dash-ai-api:ci

  infrastructure:
    name: Staging infrastructure code (cfn-lint, policy tests, one-off database scripts on local TLS PostgreSQL; no AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Offline only: this job has no AWS credentials, calls no AWS API and deploys nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Build the API (the one-off database scripts use its pg client and migrate-cli)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dash-ai/contracts build
          pnpm --filter @dash-ai/api build
      - name: Pinned validation tools (hash-checked)
        run: |
          python3 -m venv /tmp/iac-venv
          /tmp/iac-venv/bin/pip install --require-hashes -r deploy/aws/requirements.txt
      - name: cfn-lint, policy tests and the one-off database scripts (local PostgreSQL 16 with TLS)
        run: PATH="/tmp/iac-venv/bin:$PATH" deploy/aws/validate.sh --ops-db
