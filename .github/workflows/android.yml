# Android app module: compile, Robolectric/Room unit tests, lint, and a DEBUG APK that is checked
# for provider keys/endpoints. Needs an Android-capable runner (Google Maven + Android SDK), so it is
# isolated from the fast CI jobs and only runs when Android or contract inputs change (or on demand).
# Release builds are never made here: see release.yml.
name: Android app

on:
  push:
    branches: ["**"]
    paths:
      - "apps/android/**"
      - "packages/contracts/fixtures/**"
      - "scripts/check-apk.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/contracts/fixtures/**"
      - "scripts/check-apk.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Android app (compile, unit/UI tests, lint, debug APK check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package in the action's default list no longer exists.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compile the app module (main and unit-test sources)
        working-directory: apps/android
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon --stacktrace
      - name: Robolectric Compose UI and Room unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Android lint
        working-directory: apps/android
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Build the debug APK
        working-directory: apps/android
        # Firebase client configuration for push (FCM), from the repository's Actions variables; the
        # Gradle build validates the formats and turns push off when they are empty. Only this step
        # receives them, and nothing here prints them. No google-services.json, no service account.
        env:
          DASH_FIREBASE_PROJECT_ID: ${{ vars.DASH_FIREBASE_PROJECT_ID }}
          DASH_FIREBASE_APP_ID: ${{ vars.DASH_FIREBASE_APP_ID }}
          DASH_FIREBASE_API_KEY: ${{ vars.DASH_FIREBASE_API_KEY }}
          DASH_FIREBASE_SENDER_ID: ${{ vars.DASH_FIREBASE_SENDER_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Check the APK contains no provider keys or endpoints
        run: scripts/check-apk.sh apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record the APK checksum
        run: |
          { echo "### Debug APK"; echo '```'; sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dash-ai-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload app test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: "TEMPORARY verification (throwaway branch, not for merge): installability and Firebase config; values never printed"
        run: |
          set -euo pipefail
          echo "=== TEMP-VERIFY START ==="
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "== apksigner verify (exit code 0 means the signatures verify)"
          "$BT/apksigner" verify --verbose "$APK" | grep -E "^(Verifies|Verified using|Number of signers)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate DN"
          echo "== aapt2 dump badging (selected lines)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion|targetSdkVersion|application-debuggable|uses-permission: name='android.permission.POST_NOTIFICATIONS'|launchable-activity)"
          echo "== androguard inspection"
          python3 -m pip install -q --disable-pip-version-check androguard
          python3 -I .github/tmp-verify/inspect_apk.py "$APK"
          echo "=== TEMP-VERIFY END ==="

  jvm-ui:
    name: App UI on the JVM (compile, UI tests, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the app's UI against Compose Multiplatform and run its UI tests
        working-directory: apps/android/jvm-ui
        run: ../gradlew test --no-daemon
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-ui-screenshots
          path: |
            apps/android/jvm-ui/build/screenshots/
            apps/android/jvm-ui/build/reports/
          if-no-files-found: ignore
          retention-days: 7
